spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pricecompare}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=15m
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

app:
  mock-stores: false
  search-timeout-seconds: 8
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-of-at-least-32-characters-here}
    expiry-hours: 24
  stores:
    flipkart:
      tracking-id: ${FLIPKART_ID:}
      token: ${FLIPKART_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
